<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Champions Damage Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>Pokémon Champions</h1>
        <h2>Damage Calculator</h2>
    </header>

    <!-- 攻撃側 -->
    <section class="card">

        <div class="section-title">
            ⚔️ 攻撃側
            <button class="detail-button">⚙</button>
        </div>

        <input
            type="text"
            id="attackerPokemon"
            placeholder="ポケモン名">

        <div class="search-box" id="attackerSearchBox"></div>

        <div class="row">

            <select id="attackerType1">
                <option value="">タイプ1</option>
            </select>

            <select id="attackerType2">
                <option value="">タイプ2</option>
            </select>

        <div class="row">

    <select id="attackerAbility">
        <option>特性</option>
    </select>

    <select id="attackerItem">
        <option>持ち物</option>
    </select>

</div>

<div class="row">

    <input
        type="number"
        id="attackerPoint"
        placeholder="攻撃能力ポイント"
        value="0">

    <select id="attackerNature">
        <option value="1.0">性格（ふつう）</option>
        <option value="1.1">攻撃↑</option>
        <option value="0.9">攻撃↓</option>
    </select>

</div>
    </section>

    <!-- 防御側 -->
    <section class="card">

        <div class="section-title">
            🛡️ 防御側
            <button class="detail-button">⚙</button>
        </div>

        <input
            type="text"
            id="defenderPokemon"
            placeholder="ポケモン名">

        <div class="search-box" id="defenderSearchBox"></div>

        <div class="row">

            <select id="defenderType1">
                <option value="">タイプ1</option>
            </select>

            <select id="defenderType2">
                <option value="">タイプ2</option>
            </select>

        </div>

        <div class="row">

    <input
        type="number"
        id="defenderPoint"
        placeholder="防御能力ポイント"
        value="0">

    <select id="defenderNature">
        <option value="1.0">性格（ふつう）</option>
        <option value="1.1">防御↑</option>
        <option value="0.9">防御↓</option>
    </select>

</div>
    </section>

    <!-- 技 -->
<section class="card">

    <div class="section-title">
        💥 技
        <button class="detail-button">⚙</button>
    </div>

    <input
        type="text"
        id="moveName"
        placeholder="技名"
        autocomplete="off">

    <div
        class="search-box"
        id="moveSearchBox">
    </div>

    <div class="row">

        <input
            type="number"
            id="power"
            placeholder="威力"
            readonly>

        <select id="moveType">
            <option value="">タイプ</option>
        </select>

    </div>

    <div class="row">

        <input
            type="text"
            id="moveCategory"
            placeholder="分類"
            readonly>

        <input
            type="number"
            id="moveAccuracy"
            placeholder="命中"
            readonly>

    </div>

</section>
    <button id="calculateButton">
        ダメージ計算
    </button>

    <!-- 計算結果 -->
    <section class="card">

        <div class="section-title">
            📊 計算結果
        </div>

        <div id="damageValue">
            -
        </div>

        <div id="damagePercent">
            -
        </div>

        <div id="koCount">
            -
        </div>

        <div class="hp-bar">
            <div class="hp-fill"></div>
        </div>

    </section>

</div>

<!-- データ -->
<script src="data/types.js"></script>

<!-- JavaScript -->
<script src="js/loader.js"></script>
<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/damage.js"></script>
<script src="js/calculator.js"></script>

<!-- メイン -->
<script src="main.js"></script>
    
</body>
</html>
<script>
alert("JS読み込みOK");
</script>
